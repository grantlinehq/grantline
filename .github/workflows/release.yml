name: Release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0-rc.1'
        required: true
        type: string
      publish:
        description: 'Publish image and chart after release environment approval'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      IMAGE: ghcr.io/grantlinehq/grantline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate release inputs
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REGISTRY_ALLOWED: ${{ vars.ALLOW_REGISTRY_PUBLISH }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^0\.1\.0(-rc\.[0-9]+)?$ ]]
          test "${GITHUB_REF_NAME}" = main
          if [ "$PUBLISH_REQUESTED" = true ]; then
            test "$REGISTRY_ALLOWED" = true || { echo 'Registry publication is not enabled by the maintainer.'; exit 1; }
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/grantlinehq/grantline:${{ inputs.version }}
          build-args: VERSION=v${{ inputs.version }}
          push: ${{ inputs.publish }}
          outputs: ${{ !inputs.publish && 'type=oci,dest=/tmp/grantline.oci.tar' || '' }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: inputs.publish
      - name: Sign published digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: v4.3.0}
      - name: Package Helm and installation bundle
        run: |
          mkdir -p /tmp/release
          helm package charts/grantline --version "$RELEASE_VERSION" --app-version "$RELEASE_VERSION" -d /tmp/release
          printf 'GRANTLINE_IMAGE=ghcr.io/grantlinehq/grantline:%s\n' "$RELEASE_VERSION" > .env
          tar -czf /tmp/release/grantline-install.tar.gz .env compose.yaml deploy README.md LICENSE NOTICE docs/guide web/public/brand
          if [ -f /tmp/grantline.oci.tar ]; then mv /tmp/grantline.oci.tar /tmp/release/; fi
          cd /tmp/release
          sha256sum * > SHA256SUMS
      - name: Publish Helm chart
        if: inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "/tmp/release/grantline-$RELEASE_VERSION.tgz" oci://ghcr.io/grantlinehq/charts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grantline-${{ inputs.version }}
          path: |
            /tmp/release/*
          if-no-files-found: error

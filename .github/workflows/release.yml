name: Release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version, e.g. 0.1.0-rc.4'
        required: true
        type: string
      publish:
        description: 'Publish image, chart and a GitHub prerelease'
        type: boolean
        default: false
      resume_digest:
        description: 'Optional existing image digest: finish an interrupted publication without rebuilding or retagging'
        type: string
        default: ''
      resume_chart_digest:
        description: 'Optional existing chart digest when resuming after chart publication'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: grantline-release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  package:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RESUME_DIGEST: ${{ inputs.resume_digest }}
      RESUME_CHART_DIGEST: ${{ inputs.resume_chart_digest }}
      IMAGE: ghcr.io/grantlinehq/grantline
      CHART: ghcr.io/grantlinehq/charts/grantline
      SIGNER: https://github.com/grantlinehq/grantline/.github/workflows/release.yml@refs/heads/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0}
      - name: Validate release inputs
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
          REGISTRY_ALLOWED: ${{ vars.ALLOW_REGISTRY_PUBLISH }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^0\.1\.0-rc\.[1-9][0-9]*$ ]]
          test "${GITHUB_REF_NAME}" = main
          if [ "$PUBLISH_REQUESTED" = true ]; then
            test "$REGISTRY_ALLOWED" = true || { echo 'Registry publication is not enabled by the maintainer.'; exit 1; }
          fi
          if [ -n "$RESUME_DIGEST" ]; then
            test "$PUBLISH_REQUESTED" = true
            [[ "$RESUME_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          if [ -n "$RESUME_CHART_DIGEST" ]; then
            test -n "$RESUME_DIGEST"
            [[ "$RESUME_CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi
          mkdir -p /tmp/release
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the immutable release source
        id: source
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          result = subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/v{os.environ["RELEASE_VERSION"]}'], capture_output=True, text=True)
          if result.returncode == 0 or str(json.loads(result.stdout).get('status')) != '404':
              raise SystemExit('Release already exists or its absence could not be verified')
          PY
          SOURCE_COMMIT="$GITHUB_SHA"
          if [ -n "$RESUME_DIGEST" ]; then
            EXISTING_DIGEST=$(docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" | awk '$1 == "Digest:" {print $2; exit}')
            test "$EXISTING_DIGEST" = "$RESUME_DIGEST"
            docker pull --platform linux/amd64 "$IMAGE@$RESUME_DIGEST"
            SOURCE_COMMIT=$(docker image inspect "$IMAGE@$RESUME_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA"
            # Package the exact source that produced this image, not later files.
            git checkout --detach "$SOURCE_COMMIT"
          elif docker buildx imagetools inspect "$IMAGE:$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'Image version already exists; provide its exact digest to resume, or choose a new version.'
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            test "$(git rev-parse "refs/tags/v$RELEASE_VERSION^{}")" = "$SOURCE_COMMIT"
          fi
          echo "commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Create and verify the exact release tag
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          TAG="v$RELEASE_VERSION"
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_COMMIT" >/dev/null
          fi
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$SOURCE_COMMIT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: image
        if: inputs.resume_digest == ''
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/grantlinehq/grantline:${{ inputs.version }}
          build-args: VERSION=v${{ inputs.version }}
          push: ${{ inputs.publish }}
          outputs: ${{ !inputs.publish && 'type=oci,dest=/tmp/grantline.oci.tar' || '' }}
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          annotations: |
            index:org.opencontainers.image.description=Evidence-first non-human identity security
      - name: Select candidate digest
        id: candidate
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "digest=${RESUME_DIGEST:-$BUILT_DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan published amd64 image
        if: inputs.publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/amd64
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: /tmp/release/trivy-amd64.json
      - name: Scan published arm64 image
        if: inputs.publish
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: linux/arm64
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: json
          output: /tmp/release/trivy-arm64.json
      - name: Verify the registry image and clean installation
        if: inputs.publish
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json
          for arch in ['amd64','arm64']:
              result = json.load(open(f'/tmp/release/trivy-{arch}.json'))
              assert result['Metadata']['ImageConfig']['architecture'] == arch
          PY
          docker pull "$IMAGE@$DIGEST"
          python3 scripts/acceptance-compose.py --image "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw > /tmp/image-index.json
          ARM_DIGEST=$(python3 -c 'import json; m=json.load(open("/tmp/image-index.json")); print(next(x["digest"] for x in m["manifests"] if x.get("platform",{}).get("os")=="linux" and x["platform"].get("architecture")=="arm64"))')
          docker run --rm --platform linux/arm64 "$IMAGE@$ARM_DIGEST" version
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .SBOM}}' > /tmp/release/sbom.json
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Provenance}}' > /tmp/release/provenance.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        if: inputs.publish
        with: {cosign-release: v3.1.3}
      - name: Sign published digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /tmp/release/image-signature-verification.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with: {version: v4.3.0}
      - name: Package Helm
        if: inputs.resume_chart_digest == ''
        run: |
          helm package charts/grantline --version "$RELEASE_VERSION" --app-version "$RELEASE_VERSION" -d /tmp/release
      - name: Publish Helm chart
        id: chart
        if: inputs.publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [ -n "$RESUME_CHART_DIGEST" ]; then
            helm pull "oci://$CHART" --version "$RELEASE_VERSION" --destination /tmp/release 2>&1 | tee /tmp/chart-push.txt
          else
            helm push "/tmp/release/grantline-$RELEASE_VERSION.tgz" oci://ghcr.io/grantlinehq/charts 2>&1 | tee /tmp/chart-push.txt
          fi
          CHART_DIGEST=$(sed -n 's/^Digest: //p' /tmp/chart-push.txt)
          [[ "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [ -n "$RESUME_CHART_DIGEST" ]; then
            test "$CHART_DIGEST" = "$RESUME_CHART_DIGEST"
          fi
          echo "digest=$CHART_DIGEST" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/chart-pull
          helm pull "oci://$CHART" --version "$RELEASE_VERSION" --destination /tmp/chart-pull
          cmp "/tmp/release/grantline-$RELEASE_VERSION.tgz" "/tmp/chart-pull/grantline-$RELEASE_VERSION.tgz"
          helm template verify "/tmp/chart-pull/grantline-$RELEASE_VERSION.tgz" -f charts/grantline/examples/production.yaml >/tmp/chart-render.yaml
          cosign sign --yes "$CHART@$CHART_DIGEST"
          cosign verify "$CHART@$CHART_DIGEST" --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com > /tmp/release/chart-signature-verification.json
      - name: Package and sign release downloads
        if: inputs.publish
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 - <<'PY'
          import json, os
          publisher = {'source_commit': os.environ['SOURCE_COMMIT'], 'workflow_commit': os.environ['GITHUB_SHA'], 'workflow_run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']}
          with open('/tmp/release/publisher.json', 'w') as target:
              json.dump(publisher, target, indent=2)
          PY
          python3 scripts/package-release.py --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" --image-digest "$IMAGE_DIGEST" --chart-digest "$CHART_DIGEST" --chart "/tmp/release/grantline-$RELEASE_VERSION.tgz" --output /tmp/release
          cosign sign-blob --yes --bundle /tmp/release/SHA256SUMS.sigstore.json /tmp/release/SHA256SUMS
          cosign verify-blob --bundle /tmp/release/SHA256SUMS.sigstore.json --certificate-identity "$SIGNER" --certificate-oidc-issuer https://token.actions.githubusercontent.com /tmp/release/SHA256SUMS
          cd /tmp/release
          sha256sum --check SHA256SUMS
      - name: Package unpublished build artifacts
        if: ${{ !inputs.publish }}
        run: |
          mv /tmp/grantline.oci.tar /tmp/release/
          cd /tmp/release
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grantline-${{ inputs.version }}
          path: |
            /tmp/release/*
          if-no-files-found: error
      - name: Create GitHub prerelease with ready installation packages
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$RELEASE_VERSION" /tmp/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Grantline v$RELEASE_VERSION" --notes-file /tmp/release/RELEASE-NOTES.md --prerelease --latest=false

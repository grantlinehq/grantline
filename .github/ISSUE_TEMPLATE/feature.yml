name: Feature request
description: Explain a workflow that Grantline should support.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or workflow, description: Explain the user need without private organization details.}
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes: {label: Desired behavior and alternatives}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: Permissions and data implications, description: Describe new metadata or privileges if known.}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grantline.name" . }}
  labels: {{- include "grantline.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grantline.name" . }}
  labels: {{- include "grantline.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
  selector: {app.kubernetes.io/name: grantline, app.kubernetes.io/instance: {{ .Release.Name }}}

{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "grantline.name" . }}-postgres
  labels: {{- include "grantline.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports: [{name: postgres, port: 5432}]
  selector: {app.kubernetes.io/name: grantline-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grantline.name" . }}-postgres-init
data:
  10-grantline.sql: |
    \set app_password `cat /run/secrets/password`
    BEGIN;
    CREATE ROLE grantline LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
      PASSWORD :'app_password';
    ALTER DATABASE grantline OWNER TO grantline;
    ALTER ROLE postgres PASSWORD NULL;
    COMMIT;
    \unset app_password
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "grantline.name" . }}-postgres
  labels: {{- include "grantline.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "grantline.name" . }}-postgres
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/name: grantline-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grantline-postgres, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | quote }}
          securityContext: {{- include "grantline.security" . | nindent 12 }}
          env:
            - {name: POSTGRES_DB, value: grantline}
            - {name: POSTGRES_USER, value: postgres}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/password}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, grantline, -d, grantline]}, periodSeconds: 5}
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: temporary, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: secret, mountPath: /run/secrets, readOnly: true}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: temporary
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: socket
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: secret
          secret:
            secretName: {{ required "postgresql.existingSecret is required" .Values.postgresql.existingSecret }}
            defaultMode: 0440
            items: [{key: {{ .Values.postgresql.passwordKey }}, path: password}]
        - name: init
          configMap: {name: {{ include "grantline.name" . }}-postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.storage }}}
{{- end }}
